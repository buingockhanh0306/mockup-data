name: Vue CI/CD Deploy

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # FIX LỖI ERESOLVE FIREBASE
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      # (OPTION 1) Upload artifact (test)
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
